<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>모험의 시작</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:none}
  html,body{margin:0;height:100%;background:#111;color:#fff;font-family:sans-serif;overflow:hidden}
  #game{display:block;width:100%;height:100%}
  #hud{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;padding:6px 10px;font-size:14px;display:flex;gap:12px;background:#0008;pointer-events:none}
  #dpad{position:fixed;left:16px;bottom:calc(20px + env(safe-area-inset-bottom,0));width:150px;height:150px}
  #dpad button,#act{position:absolute;width:50px;height:50px;border-radius:12px;border:2px solid #fff6;background:#fff2;color:#fff;font-size:22px}
  #dpad .u{left:50px;top:0}#dpad .d{left:50px;top:100px}#dpad .l{left:0;top:50px}#dpad .r{left:100px;top:50px}
  #act{position:fixed;right:24px;bottom:calc(50px + env(safe-area-inset-bottom,0));width:80px;height:80px;border-radius:50%;font-size:18px}
  #dialog{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0));background:#000d;border:2px solid #fff;border-radius:10px;padding:14px;font-size:16px;display:none;min-height:80px}
  #battle{position:fixed;inset:0;background:#102;display:none;flex-direction:column;padding:12px;gap:10px}
  #bscene{flex:1;display:flex;justify-content:space-around;align-items:center;font-size:80px}
  #blog{background:#0008;border-radius:8px;padding:10px;min-height:64px;font-size:15px}
  #bmenu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #bmenu button{padding:16px;font-size:17px;border-radius:10px;border:2px solid #fff6;background:#335;color:#fff}
  .bar{height:8px;background:#400;border-radius:4px;overflow:hidden;margin-top:4px;width:110px}
  .bar i{display:block;height:100%;background:#4d4}
  .unit{font-size:13px;text-align:center}
  #title{position:fixed;inset:0;background:#123;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  #title h1{font-size:34px;margin:0}
  #title button{padding:14px 32px;font-size:18px;border-radius:10px;border:0;background:#4a8;color:#fff}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><span id="hLv"></span><span id="hHp"></span><span id="hG"></span></div>
<div id="dpad"><button class="u">▲</button><button class="l">◀</button><button class="r">▶</button><button class="d">▼</button></div>
<button id="act">대화</button>
<div id="dialog"></div>
<div id="battle">
  <div id="bscene">
    <div class="unit"><div id="pIcon">🧙</div><div id="pName"></div><div class="bar"><i id="pBar"></i></div></div>
    <div class="unit"><div id="eIcon"></div><div id="eName"></div><div class="bar"><i id="eBar"></i></div></div>
  </div>
  <div id="blog"></div>
  <div id="bmenu">
    <button data-a="atk">⚔️ 공격</button><button data-a="skill">🔥 화염 (MP 3)</button>
    <button data-a="potion">🧪 포션</button><button data-a="run">🏃 도망</button>
  </div>
</div>
<div id="title"><h1>⚔️ 모험의 시작</h1><button id="bNew">새 게임</button><button id="bCont">이어하기</button></div>
<script>
(()=>{
const T=40, W=32, H=26;
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let vw,vh; function resize(){vw=cv.width=innerWidth;vh=cv.height=innerHeight} addEventListener('resize',resize);resize();

// 타일: 0 풀, 1 나무(벽), 2 물(벽), 3 수풀(전투), 4 길, 5 집(벽), 6 상점문
const map=[];
for(let y=0;y<H;y++){map[y]=[];for(let x=0;x<W;x++){
  let t=0;
  if(x==0||y==0||x==W-1||y==H-1)t=1;
  else if(x>=3&&x<=8&&y>=15&&y<=20)t=2;                // 연못
  else if(x>=14&&y>=3&&y<=22&&(x*7+y*13)%5<3)t=3;      // 동쪽 수풀
  else if((x*31+y*17)%23==0)t=1;
  map[y][x]=t;}}
for(let x=1;x<14;x++){map[8][x]=4;map[9][x]=4}          // 마을 길
for(let y=3;y<13;y++){map[y][10]=4}
[[4,3],[5,3],[6,3],[4,4],[5,4],[6,4]].forEach(([x,y])=>map[y][x]=5);
map[5][5]=6; map[5][4]=4; map[5][5]=6;
for(let y=1;y<H-1;y++)for(let x=11;x<15;x++)if(map[y][x]==1&&x<14)map[y][x]=0;

const npcs=[
 {x:9,y:7,icon:'👴',lines:['어서 오게, 용사여.','동쪽 수풀에 몬스터가 나타나고 있다네.','레벨을 올려 보스를 쓰러뜨려 주게!']},
 {x:5,y:6,icon:'🧑‍🌾',shop:true,lines:['상점입니다. 포션(20G)을 사시겠어요?']},
 {x:12,y:11,icon:'💤',heal:true,lines:['여관: 푹 쉬었다! HP/MP가 모두 회복되었다.']},
 {x:29,y:12,icon:'🐉',boss:true,lines:['크아앙! 나는 드래곤이다!']}
];
const mobs=[
 {n:'슬라임',i:'🟢',hp:20,atk:4,exp:8,g:5},
 {n:'박쥐',i:'🦇',hp:28,atk:6,exp:12,g:8},
 {n:'오크',i:'👹',hp:45,atk:9,exp:22,g:15},
 {n:'해골',i:'💀',hp:60,atk:12,exp:35,g:25}
];
const boss={n:'드래곤',i:'🐉',hp:220,atk:20,exp:300,g:500};

let P;
function newGame(){P={x:9,y:9,lv:1,exp:0,hp:40,mhp:40,mp:10,mmp:10,atk:8,g:30,pot:2,boss:false}}
function save(){localStorage.setItem('rpg',JSON.stringify(P))}
function load(){try{const s=localStorage.getItem('rpg');if(s){P=JSON.parse(s);return true}}catch(e){}return false}

let state='title', moveDir=null, moveT=0, dlgQ=[], dlgCb=null, steps=0;
function hud(){$('hLv').textContent='Lv.'+P.lv;$('hHp').textContent=`HP ${P.hp}/${P.mhp}  MP ${P.mp}/${P.mmp}`;$('hG').textContent=`💰${P.g}  🧪${P.pot}`}

// ----- 대화 -----
function say(lines,cb){dlgQ=lines.slice();dlgCb=cb||null;state='dialog';nextLine()}
function nextLine(){
  const d=$('dialog');
  if(!dlgQ.length){d.style.display='none';state='map';const c=dlgCb;dlgCb=null;if(c)c();return}
  d.style.display='block';d.textContent=dlgQ.shift();
}
$('dialog').addEventListener('pointerdown',e=>{e.preventDefault();if(state==='dialog')nextLine()});

// ----- 입력 -----
const keys={};
addEventListener('keydown',e=>{keys[e.key]=1;if((e.key==='Enter'||e.key===' ')) interact()});
addEventListener('keyup',e=>keys[e.key]=0);
document.querySelectorAll('#dpad button').forEach(b=>{
  const d=b.className;
  const on=e=>{e.preventDefault();moveDir=d}, off=e=>{e.preventDefault();if(moveDir===d)moveDir=null};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off);
});
$('act').addEventListener('pointerdown',e=>{e.preventDefault();interact()});
function dirFromKeys(){return keys.ArrowUp||keys.w?'u':keys.ArrowDown||keys.s?'d':keys.ArrowLeft||keys.a?'l':keys.ArrowRight||keys.d?'r':null}
const V={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};
let face='d';

function npcAt(x,y){return npcs.find(n=>n.x===x&&n.y===y)}
function walkable(x,y){return x>=0&&y>=0&&x<W&&y<H&&![1,2,5].includes(map[y][x])&&!npcAt(x,y)}

function interact(){
  if(state==='dialog'){nextLine();return}
  if(state!=='map')return;
  const [dx,dy]=V[face];const n=npcAt(P.x+dx,P.y+dy);if(!n)return;
  if(n.boss){
    if(P.lv<5)return say(['드래곤: 애송이가 감히! (Lv.5 이상이 되면 다시 오라)']);
    return say(n.lines,()=>startBattle(boss,true));
  }
  if(n.heal){return say(n.lines,()=>{P.hp=P.mhp;P.mp=P.mmp;hud();save()})}
  if(n.shop){
    return say(n.lines,()=>{
      if(P.g>=20){P.g-=20;P.pot++;hud();save();say(['포션을 구매했다! (남은 골드 '+P.g+')'])}
      else say(['골드가 부족합니다.']);
    });
  }
  say(n.lines);
}

// ----- 이동 -----
function update(dt){
  if(state!=='map')return;
  moveT-=dt;
  const d=moveDir||dirFromKeys();
  if(!d||moveT>0)return;
  face=d;
  const [dx,dy]=V[d];const nx=P.x+dx,ny=P.y+dy;
  if(walkable(nx,ny)){
    P.x=nx;P.y=ny;moveT=140;
    if(map[ny][nx]===3&&Math.random()<0.15){
      const lvl=Math.min(mobs.length-1,Math.floor((P.lv-1)/2)+(Math.random()<0.4?1:0));
      startBattle(mobs[Math.min(lvl,mobs.length-1)]);
    }
  } else moveT=80;
}

// ----- 렌더 -----
const col={0:'#4a7',1:'#164',2:'#37c',3:'#285',4:'#cb8',5:'#a64',6:'#fc6'};
function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,vw,vh);
  if(state==='title'||!P)return;
  const ox=Math.round(vw/2-(P.x+.5)*T), oy=Math.round(vh/2-(P.y+.5)*T);
  const x0=Math.max(0,Math.floor(-ox/T)),x1=Math.min(W-1,Math.ceil((vw-ox)/T));
  const y0=Math.max(0,Math.floor(-oy/T)),y1=Math.min(H-1,Math.ceil((vh-oy)/T));
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    ctx.fillStyle=col[map[y][x]];ctx.fillRect(ox+x*T,oy+y*T,T,T);
    if(map[y][x]===1){ctx.font=T*.8+'px serif';ctx.fillText('🌲',ox+x*T+2,oy+y*T+T*.8)}
    if(map[y][x]===3){ctx.fillStyle='#1a5';ctx.fillRect(ox+x*T+8,oy+y*T+8,6,6);ctx.fillRect(ox+x*T+24,oy+y*T+22,6,6)}
  }
  ctx.font=T*.8+'px serif';ctx.textBaseline='alphabetic';
  npcs.forEach(n=>ctx.fillText(n.icon,ox+n.x*T+2,oy+n.y*T+T*.82));
  ctx.fillText('🧙',ox+P.x*T+2,oy+P.y*T+T*.82);
}

let last=0;function loop(t){const dt=t-last;last=t;update(dt);draw();requestAnimationFrame(loop)}

// ----- 전투 -----
let E,isBoss,busy=false;
function blog(s){$('blog').textContent=s}
function bupd(){
  $('pName').textContent=`용사 Lv.${P.lv}  HP ${P.hp}/${P.mhp}`;
  $('pBar').style.width=Math.max(0,P.hp/P.mhp*100)+'%';
  $('eName').textContent=`${E.n}  HP ${Math.max(0,E.hp)}/${E.mhp}`;
  $('eBar').style.width=Math.max(0,E.hp/E.mhp*100)+'%';
  hud();
}
function startBattle(m,b){
  E={...m,mhp:m.hp};isBoss=!!b;state='battle';busy=false;
  $('eIcon').textContent=E.i;$('battle').style.display='flex';
  blog(`${E.n}이(가) 나타났다!`);bupd();
}
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function enemyTurn(){
  setTimeout(()=>{
    const d=Math.max(1,E.atk+rnd(-2,2));P.hp-=d;
    blog($('blog').textContent+`\n${E.n}의 공격! ${d} 피해.`);bupd();
    if(P.hp<=0){
      P.hp=0;bupd();
      setTimeout(()=>{endBattle();P.hp=Math.ceil(P.mhp/2);P.g=Math.floor(P.g/2);P.x=9;P.y=9;hud();save();
        say(['쓰러졌다... 골드를 절반 잃고 마을에서 깨어났다.'])},900);
    } else busy=false;
  },700);
}
function win(){
  blog(`${E.n}을(를) 쓰러뜨렸다! EXP+${E.exp}, ${E.g}G 획득`);
  P.exp+=E.exp;P.g+=E.g;let msg=[];
  while(P.exp>=P.lv*20){P.exp-=P.lv*20;P.lv++;P.mhp+=10;P.mmp+=3;P.atk+=3;P.hp=P.mhp;P.mp=P.mmp;msg.push(`레벨 업! Lv.${P.lv}`)}
  save();bupd();
  setTimeout(()=>{endBattle();
    if(isBoss){P.boss=true;save();say(['드래곤을 쓰러뜨렸다!','🎉 게임 클리어! 축하합니다! 🎉'])}
    else if(msg.length)say(msg)},1000);
}
function endBattle(){$('battle').style.display='none';state='map';hud()}
$('bmenu').addEventListener('click',e=>{
  const a=e.target.dataset.a;if(!a||busy||state!=='battle')return;busy=true;
  if(a==='atk'){const d=P.atk+rnd(0,4);E.hp-=d;blog(`공격! ${d} 피해.`)}
  else if(a==='skill'){
    if(P.mp<3){blog('MP가 부족하다!');busy=false;return}
    P.mp-=3;const d=P.atk*2+rnd(0,5);E.hp-=d;blog(`화염! ${d} 피해.`)
  }else if(a==='potion'){
    if(P.pot<1){blog('포션이 없다!');busy=false;return}
    P.pot--;P.hp=Math.min(P.mhp,P.hp+30);blog('포션 사용! HP 30 회복.')
  }else if(a==='run'){
    if(isBoss){blog('보스에게서는 도망칠 수 없다!');enemyTurn();bupd();return}
    if(Math.random()<.6){blog('도망쳤다!');setTimeout(endBattle,500);return}
    blog('도망치지 못했다!');
  }
  bupd();
  if(E.hp<=0)win(); else enemyTurn();
});

// ----- 시작 -----
function start(){state='map';$('title').style.display='none';hud();save();
  say(['마을 노인에게 말을 걸어 보세요. (조작: 방향키/D-pad, 대화 버튼)'])}
$('bNew').onclick=()=>{newGame();start()};
$('bCont').onclick=()=>{if(load())start();else{newGame();start()}};
if(!localStorage.getItem('rpg'))$('bCont').style.display='none';
requestAnimationFrame(loop);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
